
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visibel Agency | Digital Growth Partner</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/13enH1ZFO2eucK1retpymOp_qis9F8CY9">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        .text-gradient {
            background: linear-gradient(to right, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        @keyframes scroll {
          from { transform: translateX(0); }
          to { transform: translateX(-50%); }
        }

        @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
        }

        @keyframes pulse-subtle {
          0%, 100% { transform: scale(1); opacity: 0.1; }
          50% { transform: scale(1.1); opacity: 0.2; }
        }

        @keyframes shine {
          from { transform: translateX(-100%) skewX(-15deg); }
          to { transform: translateX(200%) skewX(-15deg); }
        }

        .animate-scroll {
          /* Speed increased from 40s to 25s as per request "Percepat sedikit runningnya" */
          animation: scroll 25s linear infinite;
        }

        .animate-float {
          animation: float 3s ease-in-out infinite;
        }

        .animate-pulse-subtle {
          animation: pulse-subtle 4s ease-in-out infinite;
        }

        .marquee-container:hover .animate-scroll {
          animation-play-state: paused;
        }

        /* Hide scrollbar but keep functionality */
        .scrollbar-hide::-webkit-scrollbar {
          display: none;
        }
        .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }

        .hover-shine:hover::after {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          width: 50%;
          height: 100%;
          background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
          animation: shine 0.8s ease-in-out forwards;
          z-index: 5;
        }

        .article-content {
          overflow-wrap: break-word;
          word-wrap: break-word;
          word-break: break-word;
          -webkit-hyphens: auto;
          -ms-hyphens: auto;
          hyphens: auto;
          text-align: justify;
          text-justify: inter-word;
          line-height: 1.6;
        }

        @media (max-width: 640px) {
          .article-content {
            text-align: left; /* Better for very narrow screens */
            hyphens: none;
          }
          
          .prose {
            font-size: 15px !important;
          }

          .prose h1 { font-size: 1.75rem !important; }
          .prose h2 { font-size: 1.5rem !important; }
          .prose h3 { font-size: 1.25rem !important; }
        }

        .article-content img {
          max-width: 100%;
          height: auto;
          border-radius: 1.5rem;
        }
    </style>

</head>

</body>
